# Запуск: docker compose up --build   →   http://127.0.0.1:8000/docs
#
# api    — FastAPI + LangGraph-агент (образ из Dockerfile)
# qdrant — векторная БД в режиме сервера; данные в томе qdrant_storage
# Ollama остаётся на компьютере: в контейнере LLM работала бы без GPU / Apple Metal и в разы медленнее.
# Контейнер ходит к ней по адресу host.docker.internal.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"          # дашборд Qdrant: http://127.0.0.1:6333/dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # нужно на Linux; на Mac/Windows работает и без этого
    volumes:
      - ./models:/app/models                 # модель эмбеддингов, уже скачанная на компьютер
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
